# Curated scope `gut_all` — every human gut shotgun metagenome in the registry (all ages). Owner decision 2026-09-28:
# "curate all the non-infant samples as well, still just gut"; the infant catalog must be reproducible by filtering to the
# infant category. This pack defines the per-sample fields, their vocabularies, the routes that may commit them, and the
# tables the scope ships. The infant curated tables (sample_determinations / sample_metadata_wide / …) are NOT changed:
# their rows are copied into the gut tables verbatim (source infant_catalog) and win over archive-only values.
pack_id: gut_all
label: Human gut shotgun metagenomes, all ages
release_first: R2026.7
package_version_first: "1.8.0"
study_rule: registry_studies.host_human in {yes, mixed} and assay in {shotgun_dna, mixed} and gut_stool in body_sites, OR in_infant_catalog == include
sample_rule: registry_biosamples of those studies (all body sites kept; body_site_class marks non-gut samples) + the curated infant samples
age_categories:            # from age_at_collection_days when known, else the sample's life stage, else the study's life_stage_primary (basis recorded)
  neonate: [0, 28]
  infant: [29, 1100]
  child: [1101, 4382]      # 3–12 y
  adolescent: [4383, 6574] # 12–18 y
  adult: [6575, 23741]     # 18–65 y
  elderly: [23742, null]
infant_filter: "age_category in {neonate, infant} and body_site_class in {primary, unknown} and in_infant_catalog == include  # == the infant catalog's catalog_scope"
fields:                    # field_name → vocabulary / type; routes R1 (archive attributes) > R2 (supplementary tables) > R3 (paper prose) > R4 (abstract / study description)
  age_at_collection_days: {type: float, unit: days, routes: [R1, R2, R3, R4]}
  sex: {type: enum, values: [female, male, unknown], routes: [R1, R2, R3]}
  bmi: {type: float, unit: kg/m2, range: [10, 80], routes: [R1, R2]}
  country: {type: iso3166_alpha2, routes: [R1, R2, R3, R4]}
  health_condition: {type: vocab, vocab: config/vocab/health_conditions.yaml, routes: [R1, R2, R3, R4], detail_field: health_condition_detail}
  health_condition_detail: {type: text, max_len: 120, routes: [R1, R2, R3, R4]}
  antibiotic_exposure: {type: enum, values: ["yes", "no", unknown], routes: [R1, R2, R3, R4], note: "yes = antibiotics at or shortly before sampling per the source's own window"}
  subject_id: {type: text, routes: [R1, R2]}
  timepoint_label: {type: text, routes: [R1, R2]}
  # added 2026-09-29 (owner request): collection date, detailed location, lifestyle — release R2026.12 / package 1.12.0
  collection_date: {type: iso8601_partial, routes: [R1, R2, R3, R4], note: "as specific as the source gives it: YYYY, YYYY-MM, YYYY-MM-DD, or an ISO interval YYYY[-MM[-DD]]/YYYY[-MM[-DD]] for a stated sampling period; never a placeholder (missing / not collected / restricted access stay unknown); dates before 1980 or after the run's first_public year are rejected"}
  location_region: {type: text, max_len: 80, routes: [R1, R2, R3, R4], note: "first-level administrative region below the country (state, province, prefecture, canton, county for the UK/Ireland); English exonym, no country name"}
  location_locality: {type: text, max_len: 80, routes: [R1, R2, R3, R4], note: "city, town, village or district where subjects were recruited (not where the lab is); English exonym"}
  location_site: {type: text, max_len: 120, routes: [R1, R2, R3, R4], note: "named recruitment site: hospital, clinic, university health centre, school, cohort field station, tribe/community name; the source's own name"}
  latitude: {type: float, range: [-90, 90], routes: [R1, R2], note: "decimal degrees from lat_lon / geographic location (latitude) attributes; 4-decimal rounding"}
  longitude: {type: float, range: [-180, 180], routes: [R1, R2], note: "decimal degrees; same source row as latitude"}
  lifestyle: {type: vocab, vocab: config/vocab/lifestyle.yaml, routes: [R1, R2, R3, R4], detail_field: lifestyle_detail, note: "only when the source states it; never inferred from country"}
  lifestyle_detail: {type: text, max_len: 120, routes: [R1, R2, R3, R4], note: "named population or the source's own words (Hadza, Hutterite colony, elite rugby players)"}
  # added 2026-09-30 (owner cleanup): habitual diet, smoking, medication classes, stool consistency — route R1 first (attributes), R2–R4 later
  diet: {type: vocab, vocab: config/vocab/diet.yaml, routes: [R1, R2, R3, R4], detail_field: diet_detail, note: "habitual diet pattern stated by the source"}
  diet_detail: {type: text, max_len: 120, routes: [R1, R2, R3, R4]}
  smoking_status: {type: vocab, vocab: config/vocab/smoking.yaml, routes: [R1, R2, R3, R4], note: "never | former | current"}
  medication: {type: vocab_list, vocab: config/vocab/medication.yaml, routes: [R1, R2, R3, R4], detail_field: medication_detail, note: "';'-joined sorted codes; antibiotics are antibiotic_exposure, not here"}
  medication_detail: {type: text, max_len: 160, routes: [R1, R2, R3, R4]}
  intervention: {type: vocab_list, vocab: config/vocab/interventions.yaml, routes: [R1, R2, R3, R4], detail_field: intervention_detail, note: "what this sample's subject had received IN THE STUDY at or before sampling (';'-joined sorted codes; placebo / no_intervention for control arms and pre-intervention baselines). Per-sample from archive attributes (R1); the study-level list of administered interventions is gut_studies.interventions (R4, abstracts) and is not copied onto samples — controls of an FMT trial are not FMT samples."}
  intervention_detail: {type: text, max_len: 160, routes: [R1, R2, R3, R4]}
  stool_consistency_bristol: {type: int, range: [1, 7], routes: [R1, R2], note: "Bristol stool form scale 1–7 as stated; textual forms (hard / normal / loose / watery) are mapped 2 / 4 / 6 / 7 with confidence 0.7"}
  # added 2026-10-10 (owner request: relatedness / transmission data) — release R2026.23 / package 1.19.0
  family_id: {type: text, max_len: 80, routes: [R1, R2, R3], note: "the source's own family / household / dyad / twin-pair identifier; samples of related people share it (within the project); never a cohort or study id"}
  family_role: {type: vocab, vocab: config/vocab/family_roles.yaml, routes: [R1, R2, R3], note: "role of the sampled person in that family: mother | father | parent | child | twin | sibling | partner | grandparent | other_relative | household_member"}
  shared_setting_type: {type: vocab, vocab: config/vocab/shared_settings.yaml, routes: [R1, R2, R3, R4], detail_field: shared_setting_id, note: "a unit below the project shared with other sampled people: household, village / community, tribe, daycare / school, care home, ward, military unit, team, workplace"}
  shared_setting_id: {type: text, max_len: 120, routes: [R1, R2, R3, R4], note: "the source's name / code of that unit (e.g. 'H12', 'Mbomo', 'daycare D3')"}
# Field tiers for the site and the contribute worklist (owner decision 2026-09-29): five CORE fields, then the KEY fields.
# owner review 2026-10-01: age is core at the level of LIFE STAGE (age_category — an exact age is not required as long as the source
# establishes e.g. that the subjects are adults); the exact age moves to key fields together with sex.
core_fields: [age_category, country, health_condition, subject_id]
key_fields: [age_at_collection_days, sex, detailed_location, lifestyle, collection_date, intervention, antibiotic_exposure, bmi, timepoint_label, diet, smoking_status, medication, stool_consistency_bristol]
derived_fields:
  age_category: {life_stage: true, values: [neonate, infant, child, adolescent, adult, elderly], note: "age at collection at the level of a life stage: from the exact age when known (age_at_collection_days, bins above), else the sample's own life-stage attribute, else a cohort statement in the paper (R3) or abstract (R4), else the study's single registry life stage; the basis is recorded per sample in age_category_basis. 'unknown' = not covered."}
  detailed_location: {compose: [location_site, location_locality, location_region], sep: ", ", note: "most specific place below the country: 'site, locality, region' with empty parts dropped; not a determination itself — its parts are"}
  collection_year: {from: collection_date, note: "leading YYYY of collection_date (start of an interval)"}
  # infant-only fields carried verbatim from the curated infant tables (never minted for non-infant samples):
  delivery_mode: {type: enum, infant_only: true}
  feeding_mode: {type: enum, infant_only: true}
  preterm_status: {type: enum, infant_only: true}
  gestational_age_weeks: {type: float, infant_only: true}
  birth_weight_grams: {type: float, infant_only: true}
  maternal_antibiotics: {type: enum, infant_only: true}
  probiotic_exposure: {type: enum, infant_only: true}
  hmo_supplementation: {type: enum, infant_only: true}
  nec_status: {type: enum, infant_only: true}
future_fields: [ethnicity, alcohol, physical_activity]   # values exist in attributes; no vocabulary yet (ethnicity deliberately not curated)
tables:
  studies: gut_studies.parquet
  samples_wide: gut_sample_metadata_wide.parquet
  determinations: gut_sample_determinations.parquet
determination_schema: same columns as sample_determinations.parquet (sample_key, field_name, study_accession, field_value, value_normalized, confidence, evidence_source, evidence_locator, evidence_quote, evidence_limited_to_abstract, determined_by, route, scope, parse_note, group_audit, src_track, release_added, release_retired, package_added)
evidence_rules: infant-curation-rules §"Per-sample extraction" — verbatim quote ≤ 12 words, labelled source, confidence tier by route (R1 0.9 / R2 0.85 / R3 ≤ 0.7 / R4 ≤ 0.5), R4 rows evidence_limited_to_abstract = 1
