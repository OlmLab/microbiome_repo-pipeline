# config/releases.yaml — SINGLE SOURCE for the release model (docs/RELEASES.md is the narrative).
# Read by src/catalog/release/bitemporal.py, src/catalog/release/release_notes.py, catalog.make_version
# (release_id / previous_release_id in VERSION.json) and by the site generator (releases/, changes/ pages).
# Frozen 2026-09-26 for release R2026.1 (package 1.3.0). Do NOT rename columns or ids; append only.
schema_version: 1

release_id:
  regex: '^R\d{4}\.\d+$'            # numbered catalog releases: R<YYYY>.<n>
  first: R2026.1
  # Pre-numbered historical states are identified by the package semver string that shipped them.
  historical_regex: '^\d+\.\d+\.\d+$'

# Ordered oldest → newest. Dates and counts come from the package CHANGELOG.md / docs/CHANGELOG.md; a missing count
# is left null (never invented). n_* for R2026.1 are filled by bitemporal.py from the built tables.
  first_numbered: R2026.1            # alias of `first` (read by site_generator)
  historical: ['1.0.0', '1.1.0', '1.2.0', '1.2.1', '1.2.2']   # pre-numbered package states, oldest first (= history[].id)
history:
  - id: '1.0.0'
    package_version: '1.0.0'
    counts: {n_studies_included: 389}   # docs/CHANGELOG v10 'v1' / CYCLE_LOG build row (389 includes); '609 k determinations' is rounded → not recorded
    release_date: '2026-09-25'
    bundle: v10
    label: first public data package (package CHANGELOG "v1")
    data_tag: null
    site_tag: null
  - id: '1.1.0'
    package_version: '1.1.0'
    counts: {n_studies_included: 389, n_samples: 154222, n_determinations_current: 609584}   # package CHANGELOG v1.2: 'Sample table 154,222 → 154,206'; 'Determinations 609,584 − 97 − 23 − 125 + 9,559 = 618,898'
    release_date: '2026-09-25'
    bundle: v11
    label: sample-unit fix, auditor findings applied (package CHANGELOG "v1.1 (release v11)")
    data_tag: null
    site_tag: null
  - id: '1.2.0'
    package_version: '1.2.0'
    counts: {n_studies_included: 389, n_samples: 154206, n_determinations_current: 618898, sandpiper_version: '2.0.0'}   # package CHANGELOG v1.2 / v1.2.0
    release_date: '2026-09-26'
    bundle: v12
    label: data-model fix after Reviewer B (B1/B2/B9), Sandpiper profiles, author index, VERSION.json
    data_tag: null
    site_tag: null
  - id: '1.2.1'
    package_version: '1.2.1'
    counts: {n_studies_included: 389, n_samples: 154206, n_catalog_scope: 71795, n_determinations_current: 618898, sandpiper_version: '2.0.0'}   # package CHANGELOG v1.2.1 R3-8 (catalog_scope 71,795)
    release_date: '2026-09-26'
    label: fixes from the three final reviews (R3-1 … R3-15, F-series)
    data_tag: null
    site_tag: null
  - id: '1.2.2'
    package_version: '1.2.2'
    counts: {n_studies_included: 389, n_samples: 154206, n_catalog_scope: 72358, n_determinations_current: 618898, sandpiper_version: '2.0.0'}   # package CHANGELOG 1.2.2 (catalog_scope 71,795 → 72,358)
    release_date: '2026-09-26'
    label: owner decisions applied (701 value_history rows); first unattended GitHub Release
    data_tag: data-v1.2.2
    site_tag: site-v1.2.2

releases:
  - release_id: R2026.1
    package_version: '1.3.0'
    previous_package_version: '1.2.2'
    previous_release_id: '1.2.2'
    notes_file: RELEASE_NOTES_R2026.1.md
    data_tag: data-v1.3.0
    site_tag: site-v1.3.0
  - release_id: R2026.2
    package_version: '1.4.0'
    previous_package_version: '1.3.0'
    previous_release_id: R2026.1
    notes_file: RELEASE_NOTES_R2026.2.md
    data_tag: data-v1.4.0
    site_tag: site-v1.4.0
    label: contribute worklist (contribute_worklist.csv, contribute_worklist_fields.csv; config/contribute.yaml) + GitHub-Issue contribution intake
  - release_id: R2026.3
    package_version: '1.5.0'
    previous_package_version: '1.4.0'
    previous_release_id: R2026.2
    notes_file: RELEASE_NOTES_R2026.3.md
    data_tag: data-v1.5.0
    site_tag: site-v1.5.0
    label: monthly cycle 2026-09b — re-sweep (2 new studies judged in R2026.2) + gap-fill of 150 new PRJNA1140720 samples (family saliva, body_site excluded)
  - release_id: R2026.4
    package_version: '1.6.0'
    previous_package_version: '1.5.0'
    previous_release_id: R2026.3
    notes_file: RELEASE_NOTES_R2026.4.md
    data_tag: data-v1.6.0
    site_tag: site-v1.6.0
    label: scale-up S1 — registry tier of ALL human shotgun metagenomes (registry_studies.parquet, registry_universe_audit.csv; registry_runs.parquet as a Release asset); config/scope.yaml + config/vocab/*
  - release_id: R2026.5
    package_version: '1.7.0'
    previous_package_version: '1.6.0'
    previous_release_id: R2026.4
    notes_file: RELEASE_NOTES_R2026.5.md
    data_tag: data-v1.7.0
    site_tag: site-v1.7.0
    label: "scale-up S2 — registry sample tier (registry_biosamples = BioSample attributes of the human_all studies normalised to the vocabularies), papers / authors / BioProject records for registry studies, Sandpiper coverage per study"
  - release_id: R2026.6
    package_version: '1.7.1'
    previous_package_version: '1.7.0'
    previous_release_id: R2026.5
    notes_file: RELEASE_NOTES_R2026.6.md
    data_tag: data-v1.7.1
    site_tag: site-v1.7.1
    label: "rebrand — the site and package are the Human Shotgun-Metagenome Catalog (registry tier first); the infant gut catalog is its first curated scope; no data change"
  - release_id: R2026.7
    package_version: '1.8.0'
    previous_package_version: '1.7.1'
    previous_release_id: R2026.6
    notes_file: RELEASE_NOTES_R2026.7.md
    data_tag: data-v1.8.0
    site_tag: site-v1.8.0
    label: "curated scope gut_all — every human gut shotgun metagenome, all ages: gut_sample_determinations / gut_sample_metadata_wide / gut_studies (R1 + R2 + R4 for the non-infant studies; the infant catalog is the infant_scope filter); site renamed Microbiome Repo"

  - release_id: R2026.8
    package_version: '1.9.0'
    previous_package_version: '1.8.0'
    previous_release_id: R2026.7
    notes_file: RELEASE_NOTES_R2026.8.md
    data_tag: data-v1.9.0
