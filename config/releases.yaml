  - release_id: R2026.13
    package_version: '1.13.0'
    previous_package_version: '1.12.0'
    previous_release_id: R2026.12
    notes_file: RELEASE_NOTES_R2026.13.md
    data_tag: data-v1.13.0
    site_tag: site-v1.13.0
    label: "cleanup release: repositories renamed to microbiome_repo (new site URL); diet / smoking / medication / stool-consistency fields (R1); R3 shard 09 retried, R3b/R4b completion passes (incl. infant-extension full texts); registry gap fill (blank-taxon ENA slice + landmark cohorts); data-quality adjudication corrections; Atlas rebuilt on the official UNDP HDI table with lifestyle cards; large release assets moved to the history-free release-assets branch"

  - release_id: R2026.14
