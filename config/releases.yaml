    label: "gut_all route R3 — cohort-wide statements from open-access full text (Methods / Results) for the non-infant gut studies: two-replicate Sonnet-class extraction, verbatim-quote check, confidence ≤ 0.7; precedence R1 > R2 > R3 > R4"

  - release_id: R2026.9
    package_version: '1.10.0'
    previous_package_version: '1.9.0'
    previous_release_id: R2026.8
    notes_file: RELEASE_NOTES_R2026.9.md
    data_tag: data-v1.10.0
    site_tag: site-v1.10.0
    label: "all-age site: every section (Studies, Cohorts, Samples, Fields, Authors, Scope, Contribute) built from the catalog tables (human gut, all ages); duplicate R3/R4 cohort rows in gut_sample_determinations fixed; README re-oriented"

  - release_id: R2026.10
    package_version: '1.10.1'
    previous_package_version: '1.10.0'
    previous_release_id: R2026.9
    notes_file: RELEASE_NOTES_R2026.10.md
    data_tag: data-v1.10.1
    site_tag: site-v1.10.1
