    previous_release_id: R2026.10
    notes_file: RELEASE_NOTES_R2026.11.md
    data_tag: data-v1.11.0
    site_tag: site-v1.11.0
    label: "external curated resources ingested as R2 evidence (curatedMetagenomicData, GMrepo v3, HumanMetagenomeDB, MicrobeAtlas, mBodyMap, MicrobiomeDB, African Human Microbiome Portal, Meta2DB, BugSigDB, HMP/iHMP): 428,902 rows linking to the source records; Sources page acknowledges them"

  - release_id: R2026.12
    package_version: '1.12.0'
