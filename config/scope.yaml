  runs: registry_runs.parquet
  audit: registry_universe_audit.csv
  site_studies_path: data/registry_studies.parquet
vocab_dir: config/vocab
release_id: R2026.4          # release in which the registry tier first ships
package_version: "1.6.0"
scope_rules:
  infant_gut:
    rule: in_infant_catalog == include
    site: https://olmlab.github.io/microbiome_repo/
  gut_child:
    rule: gut_stool in body_sites AND (child in life_stages OR adolescent in life_stages)
    site: null
  gut_adult:
    rule: gut_stool in body_sites AND (adult in life_stages OR elderly in life_stages)
    site: null
  oral:
    rule: oral in body_sites
    site: null
  skin:
    rule: skin in body_sites
    site: null
  vaginal_urogenital:
    rule: vaginal_urogenital in body_sites
    site: null
  respiratory:
    rule: nasal_nasopharyngeal in body_sites OR respiratory_lower in body_sites
    site: null
  milk:
    rule: milk in body_sites
    site: null
  blood_tissue:
    rule: blood_tissue in body_sites
    site: null
  other_site:
    rule: other_site in body_sites OR eye_ear in body_sites
    site: null
  unknown_site:
    rule: unknown_site in body_sites OR body_sites empty
    site: null

