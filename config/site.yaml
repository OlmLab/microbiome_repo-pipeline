# Site / repository configuration (A15, A12, A3). Read by the Makefile `site` and `publish-branch`
# targets and by site_generator/gen/build_site.py via --base-url. The generator must refuse to build
# for publish while base_url still contains the USERNAME/REPOSITORY placeholder.
site:
  # Names live HERE only. Repositories renamed 2026-09-30 (owner): microbiome_repo (site/Pages), microbiome_repo-data, microbiome_repo-pipeline; GitHub redirects the old infant-gut-catalog* / catalog-pipeline URLs for git + web (not for Pages). Local clone directories keep their old names (.git/config is read-only under the host grant; the redirect keeps them working).
  title: "Microbiome Repo"
  short_title: "Microbiome Repo"
  tagline: "every public human shotgun-metagenome study in ENA/SRA/DDBJ (registry) and a curated, evidence-linked catalog of human gut metagenomes of all ages"
  curated_scope_title: "Infant Gut Shotgun-Metagenome Catalog"     # historical name of the infant extension (package README history); no site section carries it since 1.10.0
  curated_scope_short: "Infant gut"
  base_url: "https://olmlab.github.io/microbiome_repo/"
  placeholder_base_url: "https://USERNAME.github.io/REPOSITORY/"   # build fails if base_url == this
  build_date_source: package_release_date   # never wall-clock (A2 determinism); taken from VERSION.json
  gzip_mtime: 0                             # deterministic *.csv.gz (A2)

github:
  org: OlmLab
  repos:
    pipeline: microbiome_repo-pipeline            # this repository (code, config, docs, tests, workflows)
    data: microbiome_repo-data         # package tables <=50 MB each, audit/findings/, reports/, tags data-vX.Y.Z
    site: microbiome_repo              # GitHub Pages repo (generated output only; Pages source = Actions)
  # GitHub repository id of OlmLab/microbiome_repo-data (GET https://api.github.com/repos/OlmLab/microbiome_repo-data -> id, fetched 2026-09-26).
  # Zenodo's GitHub integration keys its badge and latest-DOI redirect on this id: https://zenodo.org/badge/<id>.svg -> https://zenodo.org/badge/latestdoi/<id>
  data_repo_id: 1389758854
  # Zenodo concept DOI (all versions; resolves to the latest archived data release). First minted by data-v1.13.1 on 2026-10-01 (version DOI 10.5281/zenodo.23087713).
  zenodo_concept_doi: 10.5281/zenodo.23087712
  default_branch: main
  issues:                                 # R1-05/R1-19: the ONE place the 'Flag an issue' target is defined (site.js/build_site.py read it)
    repo: microbiome_repo              # Issues live in the site repo; the template must be INSTALLED there (make install-workflows)
    template: simple-finding.yml          # R2026.12: the two-question form (site_generator/gen/issue_templates/simple-finding.yml); catalog-finding.yml stays installed for the audit tooling
    label: finding
  pages_source: github-actions            # deploy-pages.yml; never commit generated HTML to main
  branch_rules:
    agent_may_push_to: ["release/*", "refs/tags/data-v*", "refs/tags/site-v*"]
    agent_may_never_push_to: ["main"]
    main_ruleset: [block_force_push, block_deletion]   # as configured 2026-09-26 ('protect-main' on all three repos); no PR requirement — fast-forward pushes to main stay possible for the owner
  tag_patterns:
    data_release: "data-v{package_version}"     # e.g. data-v1.2.0 -> release.yml
    site_release: "site-v{package_version}"

about:                                    # About section (site_generator/gen/templates/about.html, base.html footer); nothing is hard-coded in templates
  lab_name: "Olm Lab at the University of Colorado Boulder"
  lab_url: "https://www.colorado.edu/lab/olm/"
  funder_name: "Anthropic's AI for Science program"
  funder_url: "https://www.anthropic.com/news/ai-for-science-program"

local:
  root: "~/catalog"                       # the ONLY rw host grant the Release Engineer profile holds
  clones:
    pipeline: "~/catalog/catalog-pipeline"
    data: "~/catalog/infant-gut-catalog-data"
    site: "~/catalog/infant-gut-catalog"
  cache: "~/catalog/cache"                # harvest cache untarred; gitignored; never an artifact
  external: "~/catalog/external"          # e.g. external/sandpiper/<zenodo_version>/
  legacy_site_clone: null                 # ~/Downloads/site was moved to clones.site on 2026-09-26

# Web analytics (R2026.16, owner request 2026-10-08). Off until an id is set; one provider at a time.
#   goatcounter: create a free site at https://www.goatcounter.com/signup (code = the subdomain you pick, e.g. microbiome-repo)
#   ga4:         a Google Analytics 4 measurement id (G-XXXXXXXXXX)
#   plausible:   the domain registered at plausible.io (olmlab.github.io/microbiome_repo)
analytics:
  provider: goatcounter
  id: ""
