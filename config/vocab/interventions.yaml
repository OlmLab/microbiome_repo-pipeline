schema_version: 1
vocabulary: interventions
note: |
  Interventions that a study ADMINISTERS to its participants (by the investigators, as part of the study design), recorded at two
  levels. Study level (catalog_studies.interventions): ';'-joined, alphabetically sorted list of codes for every intervention arm of the
  study, plus intervention_design and the population's underlying health condition; a study is tagged only when the source says the
  investigators gave the intervention (trial, feeding study, FMT procedure, surgery cohort sampled before/after). Sample level
  (field `intervention`): what THIS sample's subject had received in the study at or before sampling — the codes below plus
  `placebo` and `no_intervention` (control / pre-intervention baseline) when the source says so. Routine clinical treatment that
  the study merely observes (e.g. patients who happen to take metformin, antibiotics given in the NICU) is NOT an intervention:
  it belongs to medication / antibiotic_exposure. Never infer an intervention from a disease or from the word "treatment" alone.
codes:
  fmt: {label: Faecal microbiota transplantation, match_terms: [FMT, "faecal microbiota transplant", "fecal microbiota transplant", "fecal transplant", "stool transplant", "microbiota transfer therapy", "washed microbiota"]}
  probiotic: {label: Probiotic (live microorganisms; single strain or mixture), match_terms: [probiotic, Lactobacillus, Lacticaseibacillus, Bifidobacterium, "Saccharomyces boulardii", "B. infantis", "L. rhamnosus GG", VSL#3, kefir]}
  prebiotic_or_fibre: {label: Prebiotic / dietary fibre supplement, match_terms: [prebiotic, inulin, FOS, GOS, HMO, "human milk oligosaccharide", "resistant starch", fibre, fiber, psyllium, arabinoxylan, polydextrose]}
  synbiotic: {label: Synbiotic (probiotic + prebiotic), match_terms: [synbiotic]}
  live_biotherapeutic: {label: Defined bacterial consortium / live biotherapeutic product, match_terms: [SER-109, VE303, "defined consortium", "live biotherapeutic", "bacterial consortium", "Akkermansia supplementation"]}
  antibiotic: {label: "Antibiotic given as the study intervention (incl. eradication therapy, selective decontamination)", match_terms: [antibiotic, rifaximin, vancomycin, amoxicillin, ciprofloxacin, "eradication therapy", "selective digestive decontamination", azithromycin]}
  diet_intervention: {label: Controlled / prescribed diet or feeding regimen, match_terms: ["controlled diet", "feeding study", "dietary intervention", "ketogenic diet", "Mediterranean diet", "high-fibre diet", "low-FODMAP", "calorie restriction", "intermittent fasting", "time-restricted eating", "formula feeding trial", "exclusive enteral nutrition", EEN, "infant formula"]}
  dietary_supplement: {label: "Non-microbial dietary supplement (vitamins, minerals, omega-3, polyphenols, specific foods as supplement)", match_terms: ["vitamin D", "omega-3", "fish oil", iron, zinc, polyphenol, cranberry, "green tea", curcumin, "whole grain", walnut, almond, "dietary supplement", lactoferrin]}
  drug_therapy: {label: "Non-antibiotic pharmaceutical given as the study intervention (metformin, PPIs, biologics, chemo- / immunotherapy, statins …)", match_terms: [metformin, PPI, omeprazole, infliximab, "anti-TNF", vedolizumab, ustekinumab, chemotherapy, "immune checkpoint", nivolumab, pembrolizumab, statin, laxative, "bile acid", GLP-1, semaglutide, "oral contraceptive", corticosteroid]}
  surgery: {label: "Surgical procedure studied before/after (bariatric surgery, colectomy, cholecystectomy, transplantation …)", match_terms: ["bariatric surgery", "gastric bypass", "sleeve gastrectomy", RYGB, colectomy, cholecystectomy, "liver transplant", "kidney transplant", "stem cell transplant", HSCT, resection]}
  bowel_preparation: {label: Bowel cleansing / colonoscopy preparation, match_terms: ["bowel preparation", "bowel cleansing", "polyethylene glycol", "colonoscopy preparation"]}
  exercise: {label: Exercise / physical-training programme, match_terms: ["exercise intervention", "endurance training", "training programme", "physical activity intervention"]}
  vaccine: {label: Vaccination as the study intervention, match_terms: [vaccine, vaccination, immunization]}
  phage_therapy: {label: Bacteriophage therapy, match_terms: ["phage therapy", bacteriophage cocktail]}
  other_intervention: {label: Other administered intervention (see intervention_detail), match_terms: []}
  placebo: {label: "Placebo / sham arm (sample level only), sample_level_only: true", match_terms: [placebo, sham]}
  no_intervention: {label: "Control / pre-intervention baseline (sample level only), sample_level_only: true", match_terms: [baseline, "pre-treatment", control, untreated]}
designs: [randomized_controlled_trial, non_randomized_controlled, single_arm_before_after, crossover, observational_with_procedure, none]
