schema_version: 1
vocabulary: medication
note: |
  Medication classes taken at or shortly before sampling (excluding antibiotics — see antibiotic_exposure). The field value is a
  ';'-joined, alphabetically sorted list of codes; `none_reported` only when the source explicitly states no medication. Raw text
  goes to medication_detail. Never infer a class from a diagnosis.
codes:
  ppi: {label: Proton-pump inhibitor, match_terms: [PPI, "proton pump", omeprazole, pantoprazole, esomeprazole, lansoprazole, rabeprazole]}
  metformin: {label: Metformin, match_terms: [metformin, glucophage]}
  antidiabetic_other: {label: "Other antidiabetic (insulin, SGLT2, GLP-1, sulfonylurea)", match_terms: [insulin, SGLT2, empagliflozin, dapagliflozin, GLP-1, semaglutide, liraglutide, sulfonylurea, gliclazide, sitagliptin, DPP-4]}
  statin: {label: Statin, match_terms: [statin, atorvastatin, simvastatin, rosuvastatin]}
  antihypertensive: {label: Antihypertensive, match_terms: [antihypertensive, "ACE inhibitor", "beta blocker", "beta-blocker", "calcium channel", ARB, losartan, amlodipine]}
  nsaid_or_aspirin: {label: NSAID / aspirin, match_terms: [NSAID, aspirin, ibuprofen, naproxen, diclofenac, "anti-inflammatory drug"]}
  laxative: {label: Laxative, match_terms: [laxative, "bowel prep", polyethylene glycol, lactulose]}
  corticosteroid: {label: Corticosteroid, match_terms: [steroid, prednisone, prednisolone, budesonide, dexamethasone, hydrocortisone]}
  immunosuppressant_or_biologic: {label: "Immunosuppressant / biologic (incl. anti-TNF, checkpoint inhibitors)", match_terms: [immunosuppress, azathioprine, methotrexate, tacrolimus, cyclosporine, infliximab, adalimumab, vedolizumab, ustekinumab, "anti-TNF", nivolumab, pembrolizumab, ipilimumab, "checkpoint"]}
  chemotherapy: {label: Chemotherapy, match_terms: [chemotherap, chemo, FOLFOX, cisplatin, capecitabine]}
  antiretroviral: {label: Antiretroviral therapy, match_terms: [antiretroviral, ART, HAART]}
  antidepressant_or_antipsychotic: {label: Antidepressant / antipsychotic, match_terms: [antidepressant, SSRI, sertraline, fluoxetine, antipsychotic, olanzapine, risperidone, clozapine]}
  probiotic_or_prebiotic: {label: Probiotic / prebiotic supplement, match_terms: [probiotic, prebiotic, synbiotic, Lactobacillus supplement]}
  hormonal_contraceptive_or_hrt: {label: Hormonal contraceptive / HRT, match_terms: [contraceptive, "birth control", "hormone replacement", HRT]}
  other_medication: {label: Other medication (see medication_detail), match_terms: [medication, drug]}
  none_reported: {label: No medication reported (stated), match_terms: ["no medication", "none", "not taking"]}
  unknown: {label: Unknown / not stated, match_terms: []}
